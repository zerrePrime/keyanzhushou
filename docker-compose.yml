services:
  # 后端 API
  backend:
    build: ./backend
    container_name: research-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_PROVIDER=onnx_mini_lm
    depends_on:
      - ollama  # Ollama 单独起

  # Ollama（CPU 推理，比赛用云服务器没 GPU 时用）
  ollama:
    image: ollama/ollama:latest
    container_name: research-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

  # 前端（纯静态，nginx 托管）
  frontend:
    image: node:20-alpine
    container_name: research-agent-frontend-build
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install --registry=https://registry.npmmirror.com
      && npm run build"
    profiles: ["build-frontend"]  # 只在你要构建前端时启动

  frontend-nginx:
    image: nginx:alpine
    container_name: research-agent-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    profiles: ["serve-frontend"]

volumes:
  ollama_data:
  frontend_node_modules:
