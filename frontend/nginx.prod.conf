server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大 PDF（541 页书籍约 50MB）
    client_max_body_size 100m;

    # ===== 静态资源缓存策略 =====
    # assets/*.js|*.css 文件名含 contenthash，内容变 hash 变，可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # pdf.js 等 public 静态文件（文件名不含 hash），保守缓存 24h
    location ~* (pdf\.js|pdf-viewer\.js|pdf\.worker\.min\.js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # 入口 HTML 不缓存，否则发布新版本后浏览器仍加载旧的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 登录鉴权由后端 Cookie 会话负责（/api/auth/login），nginx 不再做 Basic Auth

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长文档解析 + Agent 多轮工具调用耗时较长（541 页书籍约 7-8 分钟）
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        # SSE 流式输出必须关闭缓冲，否则前端收不到逐 token 输出
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # 直接访问后端静态资源（PDF 预览流）同样走反代
    location /papers/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }
}
